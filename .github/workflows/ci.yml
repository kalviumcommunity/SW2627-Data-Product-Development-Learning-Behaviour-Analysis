name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: |
          python -m pytest -q

      - name: Verify production entrypoint
        env:
          LEARNLENS_SYNTHETIC_SEED: "42"
          LEARNLENS_PROCESSED_PATH: "ci_processed"
        run: |
          python run_pipeline.py
          test -s ci_processed/student_course.csv
          test -s ci_processed/quality_report.csv
          test -s ci_processed/pipeline_manifest.json
